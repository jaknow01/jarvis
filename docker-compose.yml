
services:
  agent:
    build: .
    container_name: jarvis
    restart: unless-stopped
    # Run the Messenger webhook (long-running HTTP service), not the REPL.
    # 0.0.0.0 so the caddy container can reach it over the compose network.
    command: ["poetry", "run", "uvicorn", "app.webhook:app", "--host", "0.0.0.0", "--port", "8002"]
    volumes:
      - ./app:/app/app
      - ./lib:/app/lib
      # Device DB, maps memory, and JSON stores live here — without this mount the
      # container has no smart_devices.json ("baza świateł niedostępna").
      - ./data:/app/data
    # Secrets (OPENAI_API_KEY, MESSENGER_*, etc.) come from .env; the explicit
    # `environment:` below overrides any compose-internal hosts baked into .env.
    env_file: .env
    ports:
      # Published for local debugging (curl localhost:8002/health). Caddy reaches
      # the app internally as agent:8002 and does not need this mapping.
      - "8002:8002"
    environment:
      # inside the compose network Redis is reachable at host "redis"
      REDIS_URL: redis://redis:6379
      # inside the compose network Postgres is reachable at host "postgres"
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      # inside the compose network the MLflow server is reachable at host "mlflow"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: jarvis
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  caddy:
    image: caddy:2
    container_name: jarvis_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Let's Encrypt certs + ACME account — must persist
      - caddy_config:/config
    depends_on:
      - agent

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mlflow:
    # MLflow tracking server + UI. Captures OpenAI Agents SDK traces from the app.
    # Open the UI at http://localhost:5001 -> "Traces" tab.
    # Host port is 5001 (not 5000) to avoid the macOS AirPlay/ControlCenter
    # conflict on :5000; inside the compose network the app still uses port 5000.
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: jarvis_mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/store/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5000,localhost:5001,127.0.0.1:5000,127.0.0.1:5001"
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow

  postgres:
    image: postgres:16
    container_name: jarvis_postgres
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mlflow_data:
  caddy_data:
  caddy_config:
