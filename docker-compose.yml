
x-mcp-server: &mcp-server
  restart: unless-stopped
  environment:
    MCP_CLIENTS_CONFIG: /config/clients.yaml

services:
  agent:
    build: .
    container_name: jarvis
    restart: unless-stopped
    # Run the Messenger webhook (long-running HTTP service), not the REPL.
    # 0.0.0.0 so the caddy container can reach it over the compose network.
    command: ["poetry", "run", "uvicorn", "app.webhook:app", "--host", "0.0.0.0", "--port", "8002"]
    volumes:
      - ./app:/app/app
      - ./lib:/app/lib
      # JSON stores (memory/scheduler/conversations) when DATABASE_URL is unset.
      - ./data:/app/data
      # Declarative principals config (users/groups/rosters). Gitignored + holds PSIDs,
      # so it is NOT baked into the image — it must be mounted from the host. Without this
      # mount apply_config_file() finds no file and nobody gets added ("Nie zostałeś
      # jeszcze dodany"). Read-only: the app only reads it (host edits + /reload apply).
      - ./config:/app/config:ro
    # Secrets (OPENAI_API_KEY, MESSENGER_*, etc.) come from .env; the explicit
    # `environment:` below overrides any compose-internal hosts baked into .env.
    env_file: .env
    ports:
      # Published for local debugging (curl localhost:8002/health). Caddy reaches
      # the app internally as agent:8002 and does not need this mapping.
      - "8002:8002"
    environment:
      # inside the compose network Redis is reachable at host "redis"
      REDIS_URL: redis://redis:6379
      # inside the compose network Postgres is reachable at host "postgres"
      DATABASE_URL: postgresql://jarvis:jarvis@postgres:5432/jarvis
      # inside the compose network the MLflow server is reachable at host "mlflow"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: jarvis
      # Tool servers on the compose network (keys: MCP_<NAME>_KEY in .env).
      MCP_FPL_URL: http://mcp-fpl:8010/mcp/fpl
      MCP_FINANCE_URL: http://mcp-finance:8010/mcp/finance
      MCP_WEATHER_URL: http://mcp-weather:8010/mcp/weather
      MCP_NEWS_URL: http://mcp-news:8010/mcp/news
      MCP_MATH_URL: http://mcp-math:8010/mcp/math
      MCP_MAPS_URL: http://mcp-maps:8010/mcp/maps
      MCP_CALENDAR_URL: http://mcp-calendar:8010/mcp/calendar
      MCP_HOME_URL: http://host.docker.internal:8011/mcp/home
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  # ── MCP tool servers (docs/MCP.md) ─────────────────────────────────────────────
  # One container per server, from the published images. Each reads its own env file and
  # config dir under ./mcp-config/<server>/ (gitignored): .env (secrets), clients.yaml
  # (API-key holders, incl. Jarvis's trusted key) and server-specific files. Only Caddy's
  # /mcp/fpl and /mcp/join routes are public; Jarvis reaches the rest on this network.
  mcp-fpl:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-fpl:v0.1.0
    container_name: mcp_fpl
    env_file: ./mcp-config/fpl/.env          # DATABASE_URL (mcp_fpl db), FPL_LEAGUES, JOIN_NOTIFY_*
    volumes: ["./mcp-config/fpl:/config:ro"]
    depends_on: {postgres: {condition: service_healthy}}

  mcp-finance:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-finance:v0.1.0
    container_name: mcp_finance
    env_file: ./mcp-config/finance/.env      # DATABASE_URL (mcp_finance db), OBSERVATIONS_*
    volumes: ["./mcp-config/finance:/config:ro"]
    depends_on: {postgres: {condition: service_healthy}}

  mcp-weather:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-weather:v0.1.0
    container_name: mcp_weather
    env_file: ./mcp-config/weather/.env      # OPENWEATHER_API_KEY
    volumes: ["./mcp-config/weather:/config:ro"]

  mcp-news:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-news:v0.1.0
    container_name: mcp_news
    env_file: ./mcp-config/news/.env         # TAVILY_API_KEY
    volumes: ["./mcp-config/news:/config:ro"]

  mcp-math:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-math:v0.1.0
    container_name: mcp_math
    volumes: ["./mcp-config/math:/config:ro"]

  mcp-maps:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-maps:v0.1.0
    container_name: mcp_maps
    env_file: ./mcp-config/maps/.env         # GOOGLE_MAPS_API_KEY
    environment: {MCP_CLIENTS_CONFIG: /config/clients.yaml, MCP_PLACES_CONFIG: /config/places.yaml}
    volumes: ["./mcp-config/maps:/config:ro"]

  mcp-calendar:
    <<: *mcp-server
    image: ghcr.io/jaknow01/mcp-calendar:v0.1.0
    container_name: mcp_calendar
    env_file: ./mcp-config/calendar/.env     # ICLOUD_CALDAV_USER, ICLOUD_APP_PASSWORD
    environment: {MCP_CLIENTS_CONFIG: /config/clients.yaml, MCP_CALENDAR_ACCOUNTS: /config/accounts.yaml}
    volumes: ["./mcp-config/calendar:/config:ro"]

  mcp-home:
    # This box is inside the home network, so the lighting server can run here: host
    # networking for Tuya's UDP discovery, on :8011 of the host (Jarvis reaches it via
    # host.docker.internal). On the k3s target it moves to the Pi (see mcp-home README).
    image: ghcr.io/jaknow01/mcp-home:v0.1.0
    container_name: mcp_home
    restart: unless-stopped
    network_mode: host
    environment:
      MCP_PORT: "8011"
      MCP_CLIENTS_CONFIG: /config/clients.yaml
      MCP_HOME_CONFIG: /config/home.yaml
    volumes:
      - ./mcp-config/home:/config:ro
      - ./data/smart_device_data:/data:ro    # home.yaml: devices_file: /data/smart_devices.json

  caddy:
    image: caddy:2
    container_name: jarvis_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Let's Encrypt certs + ACME account — must persist
      - caddy_config:/config
    depends_on:
      - agent
      - mcp-fpl

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mlflow:
    # MLflow tracking server + UI. Captures OpenAI Agents SDK traces from the app.
    # Open the UI at http://localhost:5001 -> "Traces" tab.
    # Host port is 5001 (not 5000) to avoid the macOS AirPlay/ControlCenter
    # conflict on :5000; inside the compose network the app still uses port 5000.
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: jarvis_mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/store/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5000,localhost:5001,127.0.0.1:5000,127.0.0.1:5001"
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow

  postgres:
    image: postgres:16
    container_name: jarvis_postgres
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Fresh volumes only: creates the mcp_fpl / mcp_finance databases and logins
      # (existing volume: run it once by hand — see deploy/postgres/README.md).
      - ./deploy/postgres/init-mcp-databases.sh:/docker-entrypoint-initdb.d/20-mcp.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mlflow_data:
  caddy_data:
  caddy_config:
