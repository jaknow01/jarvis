# Example sweep: compare candidate models for the `composer` role on a small, cheap subset.
# Copy this file and edit for your own experiments. See evals/harness/sweep_config.py.

name: composer_example        # report/run name -> evals/reports/composer_example.{json,md}
role: composer                # the role being swept (others held at baseline)

judge_model: gpt-5.6-luna     # one constant judge across the sweep (fair comparison).
                              # bare id = OpenAI native; provider/model = via adapter.
                              # Use the strongest judge available on your account for real
                              # runs; gpt-4.1-mini is a cheap, verified default here.

mock: true                    # deterministic, side-effect-free tools (recommended)

dataset: labeled              # single/multi-hop goldens under evals/datasets/<dataset>.json
limit: 4                      # cap goldens for a cheap first run (remove for the full set)

# To ALSO sweep through scripted multi-turn conversations, add this (loads
# evals/datasets/<name>.json). Each conversation is scored per-turn plus the multi-turn
# metrics (conversation_quality_pl, knowledge_retention). Omit for goldens-only.
# Simulated conversations are NOT swept here (non-deterministic — run them separately).
# conversations: conversations
#
# You can also run conversations ONLY: set `dataset:` to nothing (drop the line) and keep
# `conversations:`.
# only_ids:                   # ...or pick specific goldens instead of limit:
#   - sh_weather_now
#   - mh_commute_weather

composer_threshold: 0.7       # pass threshold for composer_quality_pl

# Fixed models for the OTHER roles (optional). Omit to use ambient .env / DEFAULT_MODEL.
# baseline:
#   coordinator: openai/gpt-5.6-luna

candidates:                   # the grid for the swept role
  - model: openrouter/deepseek/deepseek-v4-flash-0731
  - model: openai/gpt-5.6-luna
  - model: openai/gpt-4.1-mini
  - model: openrouter/qwen/qwen3.6-35b-a3b
  - model: openrouter/qwen/qwen3.6-27b
  # - model: openrouter/deepseek/deepseek-v4-flash-0731
  #   reasoning_effort: low
