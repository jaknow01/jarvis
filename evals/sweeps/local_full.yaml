# Whole network on the locally hosted model: coordinator + sub-agents + composer.
# Compare with reports/2026-10-02/subagents_local-*-deterministic (same goldens/conversations;
# there the coordinator stayed on openai/gpt-5.6-luna).
#   OPENAI_COMPAT_BASE_URL=http://192.168.0.211:8000/v1 OPENAI_COMPAT_API_KEY=local \
#     evals/.venv/bin/python -m evals.run evals/sweeps/local_full.yaml

name: local_full
role: default
judge_model: openai/gpt-5.6-luna
