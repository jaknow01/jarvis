# Sub-agents on locally hosted models (vLLM on gpu-server, see the local-models repo) vs the
# current deepseek default. role "default" overrides the `prod` model profile's `default`
# entry, i.e. every agent without its own entry — all sub-agents; coordinator/composer keep
# their prod models.
#
# The vLLM server (`gpu-server` in config/providers.yaml) hosts ONE model at a time, so run
# one local candidate per server profile:
#   OPENAI_COMPAT_API_KEY=local evals/.venv/bin/python -m evals.run evals/sweeps/subagents_local.yaml --only goldens
# and comment out the candidate whose model is not currently served.

name: subagents_local
profile: prod
role: default
judge_model: openai/gpt-5.6-luna
mock: true
dataset: labeled
conversations: conversations
composer_threshold: 0.7
timeout: 240

candidates:
  - model: openrouter/deepseek/deepseek-v4-flash-0731          # current default (baseline)
  - model: gpu-server/Intel/Qwen3.6-35B-A3B-int4-mixed-AutoRound   # profile qwen3.6-35b-a3b-parallel
  - model: gpu-server/RedHatAI/Qwen3.8-27B-INT4                     # profile qwen3.8-27b-parallel
