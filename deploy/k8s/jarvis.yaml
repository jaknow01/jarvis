# Jarvis on k3s (target topology, docs/MCP.md). Tool servers live in namespace `mcp`
# (each repo's deploy/kubernetes.yaml); the home lighting server is reached through the
# home-gateway in this namespace (mcp-home repo: deploy/k3s-home-gateway.yaml).
#
#   kubectl create namespace jarvis; kubectl create namespace mcp
#   kubectl -n jarvis create secret generic jarvis-env --from-env-file=.env
#   kubectl -n jarvis create secret generic jarvis-principals --from-file=principals.yaml=config/principals.yaml
#
# Image: build and push ghcr.io/jaknow01/jarvis:<tag> from this repo's Dockerfile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis
  namespace: jarvis
  labels: {app: jarvis}
spec:
  replicas: 1                       # the scheduler loop runs in-process
  selector:
    matchLabels: {app: jarvis}
  template:
    metadata:
      labels: {app: jarvis}         # the home-gateway NetworkPolicy admits exactly this label
    spec:
      containers:
        - name: jarvis
          image: ghcr.io/jaknow01/jarvis:latest
          command: ["poetry", "run", "uvicorn", "app.webhook:app", "--host", "0.0.0.0", "--port", "8002"]
          ports: [{containerPort: 8002, name: http}]
          envFrom: [{secretRef: {name: jarvis-env}}]
          env:
            - {name: MCP_FPL_URL, value: http://mcp-fpl.mcp.svc/mcp/fpl}
            - {name: MCP_FINANCE_URL, value: http://mcp-finance.mcp.svc/mcp/finance}
            - {name: MCP_WEATHER_URL, value: http://mcp-weather.mcp.svc/mcp/weather}
            - {name: MCP_NEWS_URL, value: http://mcp-news.mcp.svc/mcp/news}
            - {name: MCP_MATH_URL, value: http://mcp-math.mcp.svc/mcp/math}
            - {name: MCP_MAPS_URL, value: http://mcp-maps.mcp.svc/mcp/maps}
            - {name: MCP_CALENDAR_URL, value: http://mcp-calendar.mcp.svc/mcp/calendar}
            - {name: MCP_HOME_URL, value: http://mcp-home.jarvis.svc/mcp/home}
          volumeMounts:
            - {name: principals, mountPath: /app/config/principals.yaml, subPath: principals.yaml, readOnly: true}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30}
      volumes:
        - name: principals
          secret: {secretName: jarvis-principals}
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis
  namespace: jarvis
spec:
  selector: {app: jarvis}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Messenger webhook only. /internal/notify is reached in-cluster (from mcp-fpl) — NOT exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis
  namespace: jarvis
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls: [{hosts: [jarvis.example.com], secretName: jarvis-tls}]
  rules:
    - host: jarvis.example.com
      http:
        paths:
          - {path: /webhook, pathType: Prefix, backend: {service: {name: jarvis, port: {name: http}}}}
